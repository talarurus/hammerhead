name: CI

on:
  push:
    branches: [main, v0.2-dev]
  pull_request:
    branches: [main, v0.2-dev]

permissions:
  contents: read

jobs:
  trustworthy-core:
    name: G12 / ${{ matrix.os }} / Go ${{ matrix.go }}
    # Explicit standard labels: Ubuntu x64 and macOS Intel, no privileged runner.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
        go: ['1.26.0', 'stable']
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Record native platform and toolchain
        run: |
          d2_trace_dir="${RUNNER_TEMP}/hammerhead-d2-trace"
          mkdir -m 700 "$d2_trace_dir"
          printf 'HAMMERHEAD_D2_TRACE_DIR=%s\n' "$d2_trace_dir" >> "$GITHUB_ENV"
          uname -sm
          git --version
          printf 'Runner image: %s / %s\n' "$ImageOS" "$ImageVersion"
          if [ -r /etc/os-release ]; then cat /etc/os-release; else sw_vers; fi
          ulimit -a
          go version
          go env GOOS GOARCH CGO_ENABLED
      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Full tests
        env:
          HAMMERHEAD_D2_PHASE: full-normal
        run: go test -count=1 ./...
      - name: Race tests
        env:
          HAMMERHEAD_D2_PHASE: full-race
        run: go test -race -count=1 ./...
      - name: Integrated adversarial gates
        run: go test -count=1 -v ./internal/cli ./internal/engine ./internal/fs ./internal/check -run 'Test(CLI_(PartialScanEndToEnd|CancelDuringScan|SpecialFileNoHang|ActualTerminalInjection|GitTimeoutRetainsNativeFindings|InvalidResultEnums)|Acceptance_|Walk_LimitsStopEnumeration|ParseByteSize_Boundaries|SecretPatternCheck_MatchFloodBounded)'
      - name: Repeated descendant cleanup under race instrumentation
        run: go test -race -count=10 ./internal/git -run '^TestGitRunner_DescendantPipeCleanup$'
      - name: Four CGO-disabled compile checks (not runtime tests)
        shell: bash
        run: |
          build_dir=$(mktemp -d "${RUNNER_TEMP}/hammerhead-compile.XXXXXX")
          trap 'rm -rf "$build_dir"' EXIT
          for target_os in darwin linux; do
            for target_arch in arm64 amd64; do
              CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build -o "$build_dir/hammerhead-$target_os-$target_arch" ./cmd/hammerhead
            done
          done
      - name: D2 bounded focused race repetitions
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.go == '1.26.0'
        env:
          HAMMERHEAD_D2_PHASE: focused-race
        run: go test -race -count=200 -timeout=180s -v ./internal/git -run '^TestMetadata_BranchAndApplicability$/^normal$'
      - name: D2 bounded complete Git package race repetitions
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.go == '1.26.0'
        env:
          HAMMERHEAD_D2_PHASE: git-package-race
        run: go test -race -count=3 -timeout=300s -v ./internal/git
      - name: Retain bounded D2 stage traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2-preparation-${{ matrix.os }}-go-${{ matrix.go }}
          path: ${{ runner.temp }}/hammerhead-d2-trace/*.jsonl
          if-no-files-found: error
          retention-days: 14
